plugins {
    id 'java-library'
    id 'org.checkerframework' version '0.6.3' apply false
    id 'me.champeau.jmh' version '0.7.2'
    //id("net.ltgt.errorprone") version "3.1.0"
}
// TODO(remaining_work.md "toolchain"): the Checker Framework processor (defaulting to an old
// 3.19.0) crashes with NoSuchMethodError against JDK 25's internal javac APIs -- a toolchain
// incompatibility, not a source issue. Disabled for now so the module actually compiles; revisit
// by pinning a JDK-25-compatible Checker Framework version (or running this task's JDK toolchain
// pinned to an older JDK) rather than dropping nullness checking permanently.
// apply plugin: 'org.checkerframework'
//
// checkerFramework {
//     checkers = [
//             'org.checkerframework.checker.nullness.NullnessChecker',
//     ]
// }

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    api 'com.google.guava:guava:32.1.1-jre'
    implementation("com.google.guava:guava:32.1.1-jre")
    implementation 'androidx.collection:collection-jvm:1.5.0'
    testImplementation 'junit:junit:4.12'
    ext.checkerFrameworkVersion = '0.6.3'
    implementation "org.checkerframework:checker-qual:${checkerFrameworkVersion}"
    //annotationProcessor "org.checkerframework:checker:${checkerFrameworkVersion}"
}

// JMH microbenchmark comparing java.util.regex vs Ll1Pattern speed over the scraped-corpus
// golden files' AGREES rows -- see documents/remaining_work.md's "Scraped-corpus microbenchmark"
// entry and CorpusBenchmark's own javadoc. The jmh source set needs the test source set's output
// (GoldenTsv/GoldenRow/MatchOutcome) and resources (the golden TSVs themselves) on its classpath,
// since CorpusBenchmark reuses those rather than duplicating TSV-reading logic.
sourceSets {
    jmh {
        compileClasspath += sourceSets.test.output
        runtimeClasspath += sourceSets.test.output
        resources.srcDirs += sourceSets.test.resources.srcDirs
    }
}

// Named for the machine these benchmarks run on (see the Pixel 3a's own equivalently-named results
// files) -- this is a desktop-only benchmark, so whoever runs it on a different machine should
// override this, e.g. `./gradlew :llkpattern:jmh -PbenchmarkMachine=My-Machine`.
ext.benchmarkMachineName = project.findProperty('benchmarkMachine') ?: 'Intel-i7-9750H'
// Pinned so the benchmark fork always runs on the same JDK every committed baseline in benchmarks/
// was measured on, regardless of which JDK the Gradle daemon itself is running (see
// documents/notes.md's toolchain note -- the daemon has to stay on JDK 17/21).
ext.benchmarkJvm = "C:/Program Files/Java/jdk-25.0.3/bin/java.exe"
// Only llkCompile/llkMatch (the Ll1Pattern side) are ever CPU-sampled -- regexCompile/regexMatch
// are java.util.regex's own internals, not this project's code, so profiling them isn't useful.
ext.samplingBenchmarkNames = ['llkCompile', 'llkMatch']

jmh {
    // GCProfiler adds gc.count/gc.time (GCs triggered and time spent in them during measurement)
    // and gc.alloc.rate.norm (heap bytes allocated per op) as secondary metrics on every existing
    // benchmark -- see documents/notes.md's 2026-09-08 entry for why this doesn't extend to real
    // native (off-heap) memory tracking: both java.util.regex and Ll1Pattern are pure Java (no
    // JNI/off-heap allocation), so there's nothing for Native Memory Tracking to show here.
    //
    // Deliberately NOT including the `stack` sampling profiler here too -- its per-sample thread
    // interruption adds overhead that would perturb the ms/op numbers written to
    // corpus_benchmark_results.json. The `jmhSampling` task below re-runs llkCompile/llkMatch a
    // second time, stack-profiler-only, right after this task finishes.
    profilers = ['gc']
    // JMH's own defaults (10s/iteration) left warmup+measurement fixed at ~80s per benchmark
    // regardless of how fast the code is -- see documents/notes.md's 2026-09-12 entry for how that
    // was found to be the whole explanation for the desktop run's wall-clock cost dwarfing
    // AndroidCorpusBenchmark's (which times a fixed iteration count instead, mirrored here by
    // aiming for ~10 measured 1s iterations, matching that harness's per-benchmark budget). Only
    // one warmup iteration since a corpus pass warms up fully within it -- separate warmup
    // iterations mostly just re-measure the same already-hot state, not build on it further.
    warmupIterations = 1
    warmup = '1s'
    iterations = 10
    timeOnIteration = '1s'
    fork = 1
    jvm = benchmarkJvm
    // Console output (the plugin always prints a human-readable summary as the jmh task runs)
    // plus a checked-in JSON baseline file -- see remaining_work.md's "results go both places"
    // decision -- committed after a deliberate benchmark run so later runs can `git diff` it to
    // spot regressions, rather than treated as always-fresh generated output.
    resultFormat = 'JSON'
    resultsFile = project.file("${rootDir}/benchmarks/${benchmarkMachineName}_corpus_benchmark_results.json")
}

// Re-runs llkCompile/llkMatch under JMH's built-in `stack` CPU-sampling profiler and writes each
// one straight to benchmarks/<machine>_<benchmark>_sampling.txt -- the automated equivalent of the
// old manual "temporarily add 'stack:lines=4;detailLine=true' to jmh{}'s profilers, run, copy-paste
// the relevant console block, revert" dance (see documents/notes.md's 2026-09-08/09 entries). Runs
// SamplingRunner's main() (JMH's Java Runner API, not the `org.openjdk.jmh.Main` CLI) via the
// `jmhJar` fat jar's classpath -- see SamplingRunner's own javadoc for why the Java API beats
// shelling out and scraping console text. A second `me.champeau.jmh` task isn't an option here
// since that plugin only supports one profiler configuration per project.
//
// Automatically runs right after `jmh` (see `finalizedBy` below); run alone via
// `./gradlew :llkpattern:jmhSampling` to re-capture sampling without re-running the timing pass.
task jmhSampling(type: JavaExec) {
    group = 'verification'
    description = 'Re-runs llkCompile/llkMatch under JMH\'s stack profiler and writes benchmarks/*_sampling.txt.'
    dependsOn jmhJar
    executable = benchmarkJvm
    classpath = files(jmhJar.archiveFile)
    mainClass = 'com.tbohne.llkpattern.corpus.SamplingRunner'
    args = [
        benchmarkMachineName,
        project.file("${rootDir}/benchmarks").toString(),
        "${jmh.warmupIterations.get()}",
        jmh.warmup.get(),
        "${jmh.iterations.get()}",
        jmh.timeOnIteration.get(),
    ] + samplingBenchmarkNames
}
tasks.named('jmh').configure { finalizedBy jmhSampling }

// Captures an allocation-stack sampling profile via JDK Flight Recorder's jdk.ObjectAllocationSample
// event and writes benchmarks/<machine>_<benchmark>_alloc_sampling.txt -- see
// AllocationSamplingRunner's own javadoc for how this differs from jmhSampling's CPU sampling
// above (no JMH involved at all; JFR does its own independent background sampling). Opt-in, NOT
// chained after `jmh`/`jmhSampling` -- this is a separate exploratory profiling pass, not paired
// 1:1 with every timing run the way CPU sampling is. Run via
// `./gradlew :llkpattern:jmhAllocSampling`.
task jmhAllocSampling(type: JavaExec) {
    group = 'verification'
    description = 'Captures an allocation-stack sampling profile via JFR, writes benchmarks/*_alloc_sampling.txt.'
    dependsOn jmhJar
    executable = benchmarkJvm
    classpath = files(jmhJar.archiveFile)
    mainClass = 'com.tbohne.llkpattern.corpus.AllocationSamplingRunner'
    args = [
        benchmarkMachineName,
        project.file("${rootDir}/benchmarks").toString(),
        // Corpus passes per benchmark -- sized empirically (see documents/notes.md) so the
        // slower benchmark (llkCompile) lands in the ~10-20s range at the runner's own maxed-out
        // throttle setting, keeping statistical noise from too few jdk.ObjectAllocationSample
        // events reasonably low without ballooning capture time; not tied to jmh's own
        // warmup/iteration counts since JFR's sampling has no wall-clock budget to size against.
        "45000",
    ] + samplingBenchmarkNames
}

// Regenerates a scraped-corpus golden TSV file from a per-source "intermediate" TSV (see
// ./tools/scrape_*.py and CorpusGenerator's own javadoc). Usage:
//   ./gradlew :llkpattern:generateCorpus -Pinput=<intermediate.tsv> -Poutput=<golden.tsv> -Pmode=FIND
task generateCorpus(type: JavaExec) {
    group = 'verification'
    description = 'Regenerates a scraped-corpus golden TSV file from an intermediate scrape TSV.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tbohne.llkpattern.corpus.CorpusGenerator'
    args = [
        project.findProperty('input') ?: '',
        project.findProperty('output') ?: '',
        project.findProperty('mode') ?: 'FIND',
        project.findProperty('unescape') ?: 'none',
    ]
}
