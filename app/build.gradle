import com.android.build.api.variant.BuildConfigField

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tbohne.llkpattern'
    // Bumped from 33 (2026-09-08): appcompat 1.6.1's transitive androidx.activity:1.8.0 requires
    // compileSdk 34+; 36 is used instead of 34 because it's the lowest already-installed SDK
    // platform on this machine (avoids a network fetch) -- see documents/notes.md.
    compileSdk 36

    defaultConfig {
        applicationId "com.tbohne.llkpattern"
        minSdk 19
        targetSdk 33
        versionCode 1
        versionName "1.0"
        buildConfigField "Long", "BUILD_TIME", "${System.currentTimeMillis()}L"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'false'
        testInstrumentationRunnerArguments useTestStorageService: 'true'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        //resultsDir = "$buildDir/test-results"
        //reportDir = "$rootDir/test-reports"
    }
    sourceSets {
        // AndroidCorpusBenchmark reads its golden TSVs from here -- populated at build time by
        // copyGoldenAssetsForAndroidTest below, not checked in, so llkpattern's copies stay the
        // single source of truth (see documents/notes.md's on-device-benchmark entry).
        androidTest.assets.srcDirs += "$buildDir/generated/androidTestGoldenAssets"
    }
}

configurations.all {
    // llkpattern depends on Guava's -jre flavor (via androidTestImplementation project(':llkpattern')
    // below), which bundles a real `com.google.guava:listenablefuture:1.0`. Several androidx
    // libraries (androidx.test:core, androidx.concurrent:concurrent-futures) instead depend on the
    // empty stub artifact of the same coordinates that Guava's -android flavor uses to avoid a
    // real dependency -- the two can't coexist on one classpath since they claim the same Gradle
    // "capability". This is Guava's own documented workaround (see
    // https://github.com/google/guava/issues/2960) rather than anything specific to this project.
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestUtil "androidx.test.services:test-services:1.5.0"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.test:monitor:1.7.2"
    androidTestImplementation "androidx.test.services:storage:1.5.0"
    // For AndroidCorpusBenchmark (app/src/androidTest/.../corpus/), which mirrors
    // llkpattern/src/jmh/.../corpus/CorpusBenchmark.java on-device -- see documents/notes.md.
    androidTestImplementation project(':llkpattern')
}

// AndroidCorpusBenchmark reads the same scraped-corpus golden TSV files CorpusBenchmark does
// (see documents/notes.md's on-device-benchmark entry for why they're shared rather than
// duplicated) by copying them into this module's androidTest assets at build time, so the
// checked-in copies in llkpattern/src/test/resources/golden/ stay the single source of truth.
task copyGoldenAssetsForAndroidTest(type: Copy) {
    from(project(':llkpattern').file('src/test/resources/golden'))
    into("$buildDir/generated/androidTestGoldenAssets/golden")
    include '*.tsv'
}
// AGP's androidTest asset-merge tasks all depend on preBuild, so hooking in there guarantees the
// files exist before packaging without needing to name AGP's variant-specific task explicitly.
preBuild.dependsOn copyGoldenAssetsForAndroidTest

// Copy Android benchmark results to benchmarks folder automatically
tasks.register('copyBenchmarkResults') {
    def from = project.file("${buildDir}/outputs/connected_android_test_additional_output/debugAndroidTest/connected/Pixel 3a - 12")
    def into = project.file("${rootDir}/benchmarks")
    inputs.dir(from)
    outputs.dir(into)
    doLast {
        from.eachFile { sourceFile ->
            if (!sourceFile.isFile()) { return }
            def destFile = new File(into, sourceFile.name)
            destFile.bytes = sourceFile.bytes
        }
    }
}
tasks.matching { it.name.startsWith('connectedDebugAndroidTest') }.all { testTask ->
    testTask.finalizedBy copyBenchmarkResults
}