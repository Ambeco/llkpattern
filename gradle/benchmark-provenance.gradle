// Benchmark provenance: which source state produced each file under benchmarks/, and is it still current?
//
// Every benchmark output embeds `sourceHash: <scope>:<hash>` -- a content hash of the sources that can change that
// device's numbers (scope 'desktop' or 'android' below). Runners get it via the llk.sourceHash system property
// (desktop) or BuildConfig.SOURCE_HASH (Android, i.e. the sources the APK was actually built from); JMH's own JSON
// gets it injected after the run. `./gradlew benchmarkStatus` recomputes the hashes and reports each file as
// CURRENT, STALE or UNKNOWN (no embedded hash). A content hash -- not a commit hash or mtime -- so it is the same
// whether the benchmark ran before or after the commit, and the same in a fresh clone (CR bytes are skipped so
// CRLF working trees match LF checkouts).

import java.security.MessageDigest

def common = ['llkpattern/src/main', 'shared-bench', 'llkpattern/src/test/resources/golden']
ext.benchmarkScopes = [
    desktop: common + ['llkpattern/src/jmh'],
    android: common + ['app/src/androidTest'],
]

ext.sourceHash = { String scope ->
    def dirs = benchmarkScopes[scope]
    if (dirs == null) {
        throw new GradleException("Unknown benchmark scope '${scope}'; known: ${benchmarkScopes.keySet()}")
    }
    def md = MessageDigest.getInstance('SHA-256')
    def files = []
    dirs.each { d ->
        def dir = rootProject.file(d)
        if (!dir.isDirectory()) {
            throw new GradleException("Benchmark scope '${scope}' lists missing directory ${dir}")
        }
        dir.eachFileRecurse { f -> if (f.isFile()) { files << f } }
    }
    files.sort { rootProject.projectDir.toPath().relativize(it.toPath()).toString().replace(File.separator, '/') }
    files.each { f ->
        md.update(rootProject.projectDir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/').getBytes('UTF-8'))
        md.update((byte) 0)
        f.bytes.each { b -> if (b != (byte) 13) { md.update(b) } }
        md.update((byte) 0)
    }
    return md.digest().encodeHex().toString().substring(0, 16)
}

// JMH writes its JSON itself (a top-level array of objects), so inject a "sourceHash" key into each element
// after the run. Elements start at a line of exactly four spaces and a brace.
ext.embedSourceHashInJmhJson = { File json, String scope ->
    def text = json.getText('UTF-8')
    def tag = "${scope}:${sourceHash(scope)}"
    def out = text.replaceAll(/(?m)^(    )\{(\r?\n)/, { all, indent, eol -> "${indent}{${eol}${indent}    \"sourceHash\" : \"${tag}\",${eol}" })
    if (out == text) {
        throw new GradleException("Found no JMH result objects to tag in ${json}; did JMH's JSON layout change?")
    }
    json.setText(out, 'UTF-8')
}

ext.embeddedHash = { File f ->
    def m = f.getText('UTF-8') =~ /sourceHash"?\s*[:=]\s*"?(desktop|android):([0-9a-f]{16})/
    return m.find() ? [m.group(1), m.group(2)] : null
}

tasks.register('printSourceHash') {
    description = 'Prints "<scope>:<hash>" for -Pscope=desktop|android (to hand-embed into a result file known to match).'
    doLast { println "${project.findProperty('scope')}:${sourceHash(project.findProperty('scope').toString())}" }
}

tasks.register('benchmarkStatus') {
    group = 'verification'
    description = 'Reports whether each file under benchmarks/ was produced by the current sources (CURRENT/STALE/UNKNOWN).'
    doLast {
        def current = [:]
        benchmarkScopes.keySet().each { current[it] = sourceHash(it) }
        rootProject.file('benchmarks').listFiles().findAll { it.isFile() }.sort { it.name }.each { f ->
            def e = embeddedHash(f)
            if (e == null) {
                println String.format('%-8s %s  (no embedded sourceHash: measured before provenance embedding)', 'UNKNOWN', f.name)
            } else if (current[e[0]] == e[1]) {
                println String.format('%-8s %s  (scope %s)', 'CURRENT', f.name, e[0])
            } else {
                println String.format('%-8s %s  (scope %s: sources changed since it was measured -- rerun the %s benchmark)', 'STALE', f.name, e[0], e[0])
            }
        }
    }
}
